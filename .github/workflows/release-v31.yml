name: Publish V3.1 release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release v3.1 with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.1 >/dev/null 2>&1 || gh release create v3.1 --title "Student Planner V3.1" --notes "V3.1: Appearance settings (theme colour, dark mode, text size, bold, contrast) in the Android app and the website, plus the V3.0 Timetable, Attendance and Marks/CGPA. Installs over older versions and keeps your data. Website: https://1darshankumarsavsani-blip.github.io/Student-Planner/ . Tested with a simulated Android 14 only; check the new screens on your phone."
          gh release upload v3.1 release/Student_Planner_V3.1.apk --clobber
