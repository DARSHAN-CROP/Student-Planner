name: Publish V3 release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release v3.0 with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.0 >/dev/null 2>&1 || gh release create v3.0 --title "Student Planner V3.0" --notes "V3.0: Timetable, Attendance tracker, Marks and CGPA (Android More tab and the website). Installs over older versions and keeps your data. Website: https://1darshankumarsavsani-blip.github.io/Student-Planner/ . Tested with a simulated Android 14 only; check the new screens on your phone."
          gh release upload v3.0 release/Student_Planner_V3.apk --clobber
